<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ prompt_title }}...</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta name="keywords" content="{{ prompt_kw }}ai image, imageai">

  <link rel="stylesheet" href="/static/all-icons/myicon.css">
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <style>
    .center-icon {
      font-size: 2rem;
      font-weight: bold;
      color: #555;
    }
    .left-icon, .right-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      position: absolute;
      top: 0;
    }


    @media (min-width: 768px) {
    .col-md-6 {
        flex: none !important;
        width: 100% !important;
    }
  }


    @media (min-width: 1100px) {
    .col-md-6 {
        flex: 0 0 auto !important;
        width: 50% !important;
    }
}
  </style>
</head>

{% include "en/sidebar_header.html" %}
<section class="home-section" style="margin-bottom: 40px">
  <div class="container-fluid vh-100 d-flex align-items-center">
    <div class="row w-100">
      <div class="col-md-6 position-relative d-flex align-items-center justify-content-center">
        <div class="left-icon center-icon"></div>
        <img src="/static/photo/{{name}}" alt="Placeholder Image" class="img-fluid">
      </div>

      <div class="col-md-6 position-relative">
        <div class="text-center d-flex flex-column justify-content-center h-100 text-para-1" style="text-align: left;">
          {{prompt}} <br>
          <div style="display: inline; margin-top: 2vh" class="nonselectable">
            <a style="margin-right: 5vh; color: white; font-size: 40px;" onclick="shareReddit()"><i class="fa-brands fa-reddit" style="color: red;"></i></a>
            <a style="margin-right: 5vh; color: white; font-size: 40px;" onclick="shareFacebook()"><i class="fa-brands fa-facebook" style="color: blue;"></i></a>
            <a style="margin-right: 5vh; color: white; font-size: 40px;" onclick="shareTwitter()"><i class="fa-brands fa-twitter" style="color: aqua;"></i></a>
            <a style="color: white; font-size: 40px;" onclick="window.location.href='/random'"><i class="fa-solid fa-shuffle"></i></a>

          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function signupmodal() {
    var myModal = new bootstrap.Modal(document.getElementById('signupmodal'));
    myModal.show();
}

  const imageUrl = "{{HOST}}/photo/{{name.replace('.jpeg', '')}}";
  const text = "'{{prompt[0:120]}}...' Check out my generated photo on ImageGen! #AI #ImageGen";

  function shareFacebook() {
    const fbUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(imageUrl)}&quote=${encodeURIComponent(text)}`;
    window.open(fbUrl, '_blank');
  }

  function shareReddit() {
    const redditUrl = `https://www.reddit.com/submit?url=${encodeURIComponent(imageUrl)}&title=${encodeURIComponent(text)}`;
    window.open(redditUrl, '_blank');
  }

  function shareTwitter() {
    const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(imageUrl)}`;
    window.open(twitterUrl, '_blank');
  }

  </script>
</section>
</html>
